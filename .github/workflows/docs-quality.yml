name: Docs Quality

on:
  pull_request:
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - "scripts/lint-docs-consistency.py"
      - ".github/workflows/docs-quality.yml"
      # 메타데이터/핸드오프 변경도 실제 lint 체크를 수행하도록 PR 경로 범위에 포함
      # — paths 필터 미포함으로 인한 required check 무한 pending 방지(skip=승인 대체 아님).
      - ".editorial/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      # 루트 문서(README 다국어·CONTRIBUTING·AGENTS)만 바뀐 PR도 required 체크가 돌도록
      # 포함 — paths 필터 미포함으로 인한 required check 무한 pending(머지 불가) 방지.
      - "README*.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - "scripts/lint-docs-consistency.py"
      - ".github/workflows/docs-quality.yml"

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint Mermaid diagrams
        run: python3 scripts/lint-mermaid.py

  strikethrough-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint unintended strikethrough (~)
        run: python3 scripts/lint-strikethrough.py

  docs-consistency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint docs consistency (locale parity, review marker, no <details>)
        run: python3 scripts/lint-docs-consistency.py
