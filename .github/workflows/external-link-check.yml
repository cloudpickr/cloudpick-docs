name: External Link Check

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 UTC 00:00
  workflow_dispatch: # 수동 실행 가능

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude-mail
            --timeout 30
            --max-retries 3
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "console.aws.amazon.com"
            --exclude "portal.azure.com"
            --exclude "console.cloud.google.com"
            --exclude "cloud.oracle.com"
            "**/*.md"
          fail: false
          output: ./lychee/out.md
      - name: Create issue if broken links found
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 외부 링크 점검: 깨진 링크 발견"
          content-filepath: ./lychee/out.md
          labels: documentation,link-rot
          assignees: froguin
