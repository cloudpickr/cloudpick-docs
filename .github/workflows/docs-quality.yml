name: Docs Quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "scripts/check-internal-links.py"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "scripts/check-internal-links.py"
      - ".github/workflows/docs-quality.yml"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        # starlight/mcp 파생·앱 문서, 임시 핸드오버는 제외 (루트 SOT 본문만 검사)
        run: >
          markdownlint-cli2 "**/*.md"
          "#_book/**" "#node_modules/**" "#starlight/**" "#mcp/**"
          "#.reviews/**" "#HANDOVER.md" "#memory/**"

  internal-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal links and SUMMARY.md coverage
        run: python scripts/check-internal-links.py
