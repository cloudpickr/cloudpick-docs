name: External Link Check

on:
  # 매 커밋(push/PR)마다 — 문서 콘텐츠가 바뀔 때 깨진 링크를 즉시 차단
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - ".github/workflows/external-link-check.yml"
      - "scripts/check-korean-links.mjs"
      - "scripts/check-korean-links.test.mjs"
      - "lychee.toml"
  pull_request:
    paths:
      - "src/content/docs/**"
      - ".github/workflows/external-link-check.yml"
      - "scripts/check-korean-links.mjs"
      - "scripts/check-korean-links.test.mjs"
      - "lychee.toml"
      # 메타데이터/핸드오프 변경도 실제 link 체크를 수행하도록 PR 경로 범위에 포함
      # — paths 필터 미포함으로 인한 required check 무한 pending 방지.
      - ".editorial/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      # 루트 문서만 바뀐 PR도 link-check(required) 체크가 돌도록 포함 — 무한 pending 방지.
      - "README*.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
  # 주기 점검 — 콘텐츠 변경이 없어도 외부 링크가 죽는 link-rot을 잡음
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 UTC 00:00
  workflow_dispatch: # 수동 실행 가능

# 동일 ref의 이전 실행은 취소(빠른 피드백)
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Test Korean link checker adapter
        run: node --test scripts/check-korean-links.test.mjs

      # lychee 캐시 복원 — 이전 실행에서 검증된 링크 결과를 재사용해 반복 검사를 줄인다.
      # (lychee.toml의 cache=true와 함께 동작. actions/cache 없이는 run 간 캐시가 유지되지
      #  않아 매번 전체 외부 링크를 새로 검사한다.) 실패해도 저장하도록 restore/save 분리.
      # 스케줄 실행은 link-rot 감지가 목적이므로 캐시를 복원하지 않고 항상 신선하게 검사한다.
      - name: Restore lychee cache
        id: restore-lychee-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 오탐 완화 설정은 lychee.toml에 통합(User-Agent, host-concurrency,
          # accept 코드, 봇 차단 도메인 제외, cache 등). 로컬 검사와 동일 설정을 공유.
          # --max-cache-age: 캐시된 결과의 최대 수명. push/PR은 3일 캐시로 반복 검사
          #   비용을 줄이고, 스케줄(주 1회)은 0s로 캐시를 무시해 link-rot을 신선하게 잡는다.
          args: >-
            --verbose
            --no-progress
            --config lychee.toml
            --max-cache-age ${{ github.event_name == 'schedule' && '0s' || '3d' }}
            --root-dir "${{ github.workspace }}/src/content/docs"
            "src/content/docs/**/*.md"
            "src/content/docs/**/*.mdx"
          # push/PR에서는 깨진 링크 발견 시 워크플로를 실패시켜 커밋 단계에서 차단.
          # 스케줄 실행에서는 실패 대신 이슈만 생성(link-rot 추적).
          fail: ${{ github.event_name != 'schedule' }}
          output: ./lychee/out.md

      # 캐시 저장 — 링크 체크가 실패해도 부분 진행분을 저장(if: always())하여
      # 다음 실행이 이어받도록 한다(공식 권장 split 패턴). 스케줄 실행은 복원을 건너뛰므로
      # 캐시 키가 없을 수 있어, 복원 스텝이 실행된 경우에만 저장한다.
      - name: Save lychee cache
        if: always() && steps.restore-lychee-cache.outcome == 'success' && steps.restore-lychee-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: ${{ steps.restore-lychee-cache.outputs.cache-primary-key }}

      # GitHub-hosted runners are sometimes blocked by Korean public sites.
      # A tiny NCP Korea function checks only the allowlisted Korean links and
      # blocks only confirmed 404/410 responses. Missing secrets or an NCP
      # outage remain warnings; the normal lychee gate above still applies.
      - name: Check Korean links from NCP
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          NCP_LINK_CHECKER_URL: ${{ secrets.NCP_LINK_CHECKER_URL }}
          NCP_LINK_CHECKER_API_KEY: ${{ secrets.NCP_LINK_CHECKER_API_KEY }}
        run: node scripts/check-korean-links.mjs

      # 스케줄 실행에서 깨진 링크가 있으면 추적 이슈 생성
      - name: Create issue if broken links found (scheduled)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 외부 링크 점검: 깨진 링크 발견"
          content-filepath: ./lychee/out.md
          labels: documentation,link-rot
          assignees: froguin

      # push/PR 실패 시 로그에 결과를 남겨 어떤 링크가 깨졌는지 바로 확인
      - name: Show broken links on failure
        if: failure()
        run: cat ./lychee/out.md || true
