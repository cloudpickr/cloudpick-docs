name: Build

on:
  # build(required)는 모든 PR에서 실행한다. pull_request.paths 필터를 두면 필터에 없는
  # 경로만 바꾸는 PR에서 트리거조차 안 돼 required인데 영원히 pending(머지 불가)에 빠진다.
  # build는 사이트 전체를 빌드하고 내부 링크를 검증하므로 무관한 PR에서 돌아도 의미가 있다.
  pull_request:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/starlight-build.yml"

# 최소 권한: 체크아웃 후 빌드·내부 링크 검증만 하므로 읽기 권한만 필요하다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # MCP 인덱스 품질 검사(비차단) — dist/llms/* 산출물의 fence-aware 품질 점검.
      # 별도 advisory job(mcp-index-advisory)이 같은 사이트를 다시 빌드하던 중복을 없애려
      # 이미 빌드가 끝난 이 build job의 산출물을 재사용한다. 비차단(continue-on-error)이며
      # 결과는 Step Summary로 노출한다. 스크립트는 표준 라이브러리만 쓰고 ubuntu-latest는
      # python3를 기본 탑재하므로 setup-python이 필요 없다.
      - name: MCP index quality (fence-aware, advisory)
        continue-on-error: true
        run: |
          echo "## 🧭 MCP Index" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-mcp-index.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
