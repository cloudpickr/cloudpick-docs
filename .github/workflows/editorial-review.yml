name: Editorial Review

# 계약: froguin/multi-agent-stack@3113cfc §Review, approval and budget enforcement
#
# 흐름: 패킷 취득(API 데이터)→검증→분류→(B/C)독립 LLM 리뷰. 오케스트레이터
#   .editorial/run_review_gate.py 하나가 수행하고, 워크플로우는 데이터만 넘긴다.
#
# 보안(계약 §4):
#   - 신뢰된 base-branch 코드만 실행(checkout ref=default branch).
#   - PR head 코드를 절대 실행/체크아웃하지 않는다. 패킷·diff는 GitHub API로 데이터 취득.
#   - LLM 키는 이 리뷰 잡에만 최소 권한 주입. build/lint 잡에는 없음.
#   - 실패/미설정/outage/보류는 success로 변환하지 않는다(commit status에 정확 반영).
#
# 기록 status: 'editorial-review'. required 등록은 검증 후 versioned GHA로 별도.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: editorial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap guard + deps
        id: guard
        run: |
          # 게이트 스크립트가 신뢰된 base에 아직 없으면(도입 PR) 승인으로 변환하지 않는다.
          if [ ! -f .editorial/run_review_gate.py ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            pip install --quiet jsonschema
          fi

      # PR head의 변경목록·패킷·diff를 GitHub API로 '데이터'로만 취득(코드 실행/체크아웃 없음).
      - name: Collect PR data (API only)
        id: data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const { data: fresh } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const headSha = fresh.head.sha, baseSha = fresh.base.sha;
            core.setOutput('head_sha', headSha);
            core.setOutput('base_sha', baseSha);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber, per_page: 100,
            });
            const numstat = files.map(f => `${f.additions}\t${f.deletions}\t${f.filename}`).join('\n');
            const smap = { added:'A', removed:'D', modified:'M', renamed:'R', changed:'M' };
            const nameStatus = files.map(f => f.status === 'renamed'
              ? `R100\t${f.previous_filename}\t${f.filename}`
              : `${smap[f.status]||'M'}\t${f.filename}`).join('\n');
            fs.writeFileSync('/tmp/numstat.txt', numstat + '\n');
            fs.writeFileSync('/tmp/name_status.txt', nameStatus + '\n');

            // 단일 패킷 파일만 허용(다중이면 스코프 예외 불가 → 데이터 미취득, 게이트가 보류 판정).
            const packets = files.filter(f => /^\.editorial\/packets\/[^/]+\.json$/.test(f.filename));
            let packetPath = 'none';
            let packetRepoPath = '';
            if (packets.length === 1) {
              // head SHA의 콘텐츠를 API로 데이터 취득(코드 실행 아님).
              const { data: blob } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: packets[0].filename, ref: headSha,
              });
              const content = Buffer.from(blob.content, blob.encoding).toString('utf8');
              fs.writeFileSync('/tmp/packet.json', content);
              packetPath = '/tmp/packet.json';
              packetRepoPath = packets[0].filename;  // 실제 저장소 경로(파일명 검증용, #3)
            } else if (packets.length > 1) {
              core.warning(`multiple packet files (${packets.length}); not eligible for scope exception`);
            }
            core.setOutput('packet', packetPath);
            core.setOutput('packet_repo_path', packetRepoPath);

            // diff 텍스트(데이터)를 compare API로 취득 — PR head를 체크아웃하지 않는다.
            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo,
              basehead: `${baseSha}...${headSha}`,
            });
            const diffText = (cmp.files || []).map(f =>
              `--- ${f.filename}\n${f.patch || '(no textual patch)'}`).join('\n');
            fs.writeFileSync('/tmp/diff.txt', diffText);

      - name: Record bootstrap pending
        if: steps.guard.outputs.bootstrap == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: '${{ steps.data.outputs.head_sha }}',
              state: 'pending', context: 'editorial-review',
              description: 'review scripts not yet on base branch (bootstrap) — not an approval',
            });

      # 오케스트레이터 실행. exit code가 곧 결과(0=success,1=failure,2=pending/hold).
      # LLM 키는 이 스텝에만 주입. continue-on-error로 status 기록 스텝까지 진행하되,
      # 최종 job 성공 여부는 아래 'Fail job on non-success'가 게이트 결과로 결정한다.
      - name: Run editorial review gate
        if: steps.guard.outputs.bootstrap == 'false'
        id: gate
        continue-on-error: true
        env:
          AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          REVIEWER_PROVIDER: ${{ vars.REVIEWER_PROVIDER }}
        run: |
          set -o pipefail
          python3 .editorial/run_review_gate.py \
            --numstat /tmp/numstat.txt --name-status /tmp/name_status.txt \
            --diff /tmp/diff.txt --packet '${{ steps.data.outputs.packet }}' \
            --packet-repo-path '${{ steps.data.outputs.packet_repo_path }}' \
            --repo '${{ github.repository }}' --pr '${{ github.event.pull_request.number }}' \
            --base-sha '${{ steps.data.outputs.base_sha }}' \
            --head-sha '${{ steps.data.outputs.head_sha }}' \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --expires "$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v+7d +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/gate.json
          echo "gate_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/gate.json

      # 게이트 결과를 head SHA의 commit status로 정확히 기록(fail을 녹색으로 마감하지 않음).
      - name: Record review status
        if: steps.guard.outputs.bootstrap == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = null;
            try { out = JSON.parse(fs.readFileSync('/tmp/gate.json', 'utf8')); }
            catch (e) { core.warning('gate output parse failed: ' + e.message); }
            // 출력이 없거나 파싱 실패면 승인 아님(pending).
            const state = out && (out.state === 'success' || out.state === 'failure')
              ? out.state : 'pending';
            const desc = out
              ? `tier=${out.tier} verdict=${out.verdict}: ${(out.reasons && out.reasons[0]) || ''}`
              : 'gate produced no parseable result — not an approval';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: '${{ steps.data.outputs.head_sha }}',
              state, context: 'editorial-review', description: desc.slice(0, 140),
            });
            core.info(`[editorial-review] state=${state} — ${desc}`);

      # envelope/리뷰 리포트를 아티팩트로 저장(감사·재검증 근거).
      - name: Upload review report artifact
        if: steps.guard.outputs.bootstrap == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-report-${{ steps.data.outputs.head_sha }}
          path: /tmp/gate.json
          if-no-files-found: warn
          retention-days: 30

      # 게이트가 success가 아니면 job 자체를 실패시킨다(status만 기록하고 job green 금지).
      - name: Fail job on non-success
        if: steps.guard.outputs.bootstrap == 'false'
        run: |
          out=$(cat /tmp/gate.json 2>/dev/null || echo '{}')
          state=$(printf '%s' "$out" | python3 -c "import sys,json;print(json.load(sys.stdin).get('state','pending'))" 2>/dev/null || echo pending)
          echo "gate state=$state"
          if [ "$state" != "success" ]; then
            echo "::error::editorial review gate not approved (state=$state) — job fails; not an approval"
            exit 1
          fi
