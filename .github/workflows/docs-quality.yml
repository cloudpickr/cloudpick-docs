name: Docs Quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "scripts/check-internal-links.py"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "scripts/check-internal-links.py"
      - ".github/workflows/docs-quality.yml"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md" "#_book/**" "#node_modules/**"

  internal-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal links and SUMMARY.md coverage
        run: python scripts/check-internal-links.py
