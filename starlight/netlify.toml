[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# 콘텐츠 리디렉트는 public/_redirects (dist 로 복사)가 단일 소스.
# 여기에는 Netlify Function 프록시와 force 로케일 홈만 둔다.

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/ko/"
  to = "/ko/introduction/"
  status = 302
  force = true

[[redirects]]
  from = "/en/"
  to = "/en/introduction/"
  status = 302
  force = true

[[redirects]]
  from = "/ja/"
  to = "/ja/introduction/"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "/ko/introduction/"
  status = 302
  force = true
