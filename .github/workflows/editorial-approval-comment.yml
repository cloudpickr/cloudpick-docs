name: Editorial Approval Comment

# Privileged comment handling never checks out PR code. The trusted default
# branch tools fetch PR files and the approval comment only as API data.
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: editorial-approval-comment-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  editorial-c-approval:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run C-approval gate
        uses: actions/github-script@v9
        env:
          C_APPROVAL_ALLOWLIST: ${{ vars.EDITORIAL_C_APPROVAL_ALLOWLIST }}
        with:
          script: |
            const gate = require('${{ github.workspace }}/.github/scripts/c_approval_gate.cjs');
            await gate({ github, context, core, exec });
