name: Docs Quality

on:
  pull_request:
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - "scripts/lint-docs-consistency.py"
      - "scripts/lint-readability.py"
      - "scripts/lint-duplication.py"
      - "scripts/lint-taxonomy.py"
      - "scripts/lint-mcp-index.py"
      - "scripts/build-llms-locales.mjs"
      - ".github/workflows/docs-quality.yml"
      - ".github/workflows/editorial-c-approval.yml"
      # 메타데이터/핸드오프 변경도 실제 lint 체크를 수행하도록 PR 경로 범위에 포함
      # — paths 필터 미포함으로 인한 required check 무한 pending 방지(skip=승인 대체 아님).
      - ".editorial/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      # 루트 문서(README 다국어·CONTRIBUTING·AGENTS)만 바뀐 PR도 required 체크가 돌도록
      # 포함 — paths 필터 미포함으로 인한 required check 무한 pending(머지 불가) 방지.
      - "README*.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      # 사이드바/사이트 구조(astro.config.mjs)만 바뀐 PR도 required 체크가 돌도록 포함
      # — 소그룹 재편 등 config-only PR의 required check 무한 pending 방지.
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - "scripts/lint-docs-consistency.py"
      - ".github/workflows/docs-quality.yml"

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint Mermaid diagrams
        run: python3 scripts/lint-mermaid.py

  strikethrough-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint unintended strikethrough (~)
        run: python3 scripts/lint-strikethrough.py

  docs-consistency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint docs consistency (locale parity, review marker, no <details>)
        run: python3 scripts/lint-docs-consistency.py

  # 편집 품질 advisory(비차단) — 가독성·중복·분류. 사람이 육안으로 하던 편집 감사를
  # 결정적으로 재현한다. 모두 warn-only(exit 0)이며, continue-on-error로 이 잡의 결과가
  # 머지를 막지 않는다(브랜치 보호 required 아님). 결과는 Step Summary로 노출한다.
  editorial-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Readability (long/dense paragraphs & sentences)
        run: |
          echo "## 📖 Readability" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-readability.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Duplication (near-duplicate paragraphs across docs)
        run: |
          echo "## 🔁 Duplication" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-duplication.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Taxonomy (sidebar/path consistency & group size)
        run: |
          echo "## 🗂️ Taxonomy" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-taxonomy.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # MCP 인덱스 품질 advisory(비차단) — 빌드 산출물 dist/llms/*의 fence-aware 품질 검사.
  # dist/llms가 필요하므로 build 후 실행. readability/duplication과 달리 빌드 의존이라 잡 분리.
  mcp-index-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: Build (produces dist/llms/*)
        run: npm run build
      - name: MCP index quality (fence-aware)
        run: |
          echo "## 🧭 MCP Index" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-mcp-index.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
