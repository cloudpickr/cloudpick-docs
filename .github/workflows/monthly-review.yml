name: Monthly Docs Review

# 월간 문서 현행화 루틴(AGENTS.md "기준 시점: 월 단위 표기, 정기 리뷰로 최신 월 승격").
# 리듬:
#   - 매월 초: 그 달 트래킹 이슈를 자동 생성.
#   - 매일(daily): whats-new.cloud MCP로 전날 벤더 새 소식(영문 원문+공식 링크)을 그 달 이슈에
#     코멘트로 누적한다. 봇은 '제보'만 하고, 쓸만한지 판단·문서 반영은 담당 에이전트/사람의 몫.
#   - 월중: 현행화 PR은 여러 개가 될 수 있고, 각 PR은 이슈를 `Refs #N`으로 참조만 한다(조기 닫힘 방지).
#   - 월말: 사이클이 끝나면 담당자가 이슈를 수동으로 닫는다. (이 워크플로는 이슈를 자동으로 닫지 않는다.)
# 이 워크플로는 "트래킹 이슈"만 관리한다. 실제 현행화(마커 승격·사실 재검증)와 소식의 사실성·공식 링크는
# 담당 에이전트가 책임진다(AGENTS.md 공식 출처·교차검증 원칙).

on:
  schedule:
    - cron: "5 0 1 * *"    # 매월 1일 UTC 00:05 — 그 달 리뷰 이슈 생성
    - cron: "5 23 * * *"   # 매일 UTC 23:05 — daily 새 소식 수집(미 서부 15~16시 PT / 동부 18~19시 ET).
                           # AWS·Azure의 가장 늦은 발표(UTC 20~21시)까지 지난 뒤 돌려 당일분을 온전히 담는다.
  workflow_dispatch:
    inputs:
      action:
        description: "수동 실행 동작"
        type: choice
        options: [open, daily]
        default: open

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-review
  cancel-in-progress: false

jobs:
  monthly-review:
    runs-on: ubuntu-latest
    steps:
      - name: Determine action (open vs daily)
        id: mode
        uses: actions/github-script@v9
        with:
          script: |
            // schedule: cron으로 분기. "5 0 1 * *"=open, "5 23 * * *"=daily.
            // workflow_dispatch: 입력값 사용(기본 open). close는 없음 — 이슈는 월말에 사람이 닫는다.
            const cron = context.payload.schedule || "";
            let action = "open";
            if (context.eventName === "workflow_dispatch") {
              action = `${{ github.event.inputs.action }}` || "open";
            } else if (cron === "5 23 * * *") {
              action = "daily";
            }
            // KST(UTC+9) 기준 '월'을 제목/마커에 쓴다.
            const now = new Date();
            const kst = new Date(now.getTime() + 9 * 3600 * 1000);
            const year = kst.getUTCFullYear();
            const month = kst.getUTCMonth() + 1; // 1-12
            const day = kst.getUTCDate();
            const dateKst = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            core.setOutput("action", action);
            core.setOutput("year", String(year));
            core.setOutput("month", String(month));
            core.setOutput("date_kst", dateKst);
            core.info(`event=${context.eventName} cron="${cron}" action=${action} date=${dateKst}`);

      - name: Open monthly review issue
        if: steps.mode.outputs.action == 'open'
        uses: actions/github-script@v9
        with:
          script: |
            const year = ${{ steps.mode.outputs.year }};
            const month = ${{ steps.mode.outputs.month }};
            function monthName(m){return ["January","February","March","April","May","June","July","August","September","October","November","December"][m-1];}
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;
            const marker = { ko: `${year}년 ${month}월`, en: `${monthName(month)} ${year}`, ja: `${year}年${month}月` };
            const body = [
              `이번 달 문서 현행화 트래킹 이슈입니다.`,
              `(AGENTS.md: 기준 시점은 월 단위로 표기하며 정기 리뷰로 최신 월로 승격.)`,
              ``,
              `## 운영 방식`,
              `- **Daily**: 새 소식(벤더 공식 발표 등)이 있으면 이 이슈에 **공식 링크와 함께 코멘트**로 누적한다.`,
              `- **월중 PR**: 현행화 PR은 여러 개가 될 수 있다. 각 PR 설명에 \`Refs #<이 이슈 번호>\`로 **참조만** 한다.`,
              `  - ⚠️ \`Closes/Fixes #N\`은 쓰지 말 것 — PR 하나가 머지되면 이슈가 조기에 닫힌다.`,
              `- **월말**: 사이클이 끝나면 담당자가 이 이슈를 **수동으로 닫는다**(자동 닫힘 없음). 미완 항목은 다음 달 이슈로 이월.`,
              ``,
              `## 기준 시점 승격`,
              `- [ ] 전 문서 기준 마커를 \`${marker.ko}\` / \`${marker.en}\` / \`${marker.ja}\`로 승격 (index/introduction 제외)`,
              `- [ ] \`python3 scripts/lint-docs-consistency.py\` 통과 (마커 존재·대칭성)`,
              ``,
              `## 사실 재검증 (벤더 공식문서 교차검증)`,
              `- [ ] "예정"으로 남은 과거 일정(발효/출시) 현행화`,
              `- [ ] Preview → GA 전환 여부 반영`,
              `- [ ] 가격·리전 수·GA/Preview 상태 등 변동 항목 점검`,
              `- [ ] 과거 연도(2024/2025 등) 하드코딩 수치 현행성 재확인`,
              ``,
              `## 링크·구조`,
              `- [ ] 내부 링크(\`npm run build\` starlight-links-validator) 통과`,
              `- [ ] 외부 링크(lychee CI) 깨진 링크 없음`,
              `- [ ] ko/en/ja 대칭성 유지 (파일 경로·내용)`,
              ``,
              `## 로케일 대칭`,
              `- [ ] ko(SOT) 수정분을 en/ja에 100% 반영`,
              ``,
              `## 이번 달 수집된 새 소식 (daily 누적)`,
              `<!-- daily 코멘트로 쌓인 소식 중 문서에 반영한 항목을 여기에 정리 -->`,
              ``,
              `---`,
              `담당: 5개 에이전트(codex/claude/kiro/grok/gemini) 로테이션 또는 합의로 지정.`,
              `구조/분류 변경이 필요하면 과반(3표+) 의결 후 별도 PR.`,
              ``,
              `_auto-generated by \`monthly-review.yml\`_`,
            ].join("\n");

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "routine:monthly-review", per_page: 100,
            });
            const hit = existing.find((i) => i.title === title && !i.pull_request);
            if (hit) {
              core.info(`이미 존재: #${hit.number} — 생성 건너뜀`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["routine:monthly-review", "documentation"],
              });
              core.info(`생성: #${created.data.number}`);
            }

      # Open(매월 1일) 직후: stale 후보 스캐너(1단계, 결정론)를 ko 전체에 돌려 그 달 이슈에
      # 요약 코멘트를 남긴다. whats-new가 '새로 나온 것'을 제보한다면, 이쪽은 '기존 문서에 이미
      # 박힌 낡았을 수 있는 서술'을 제보한다(push 보완용 pull 스캔). 봇은 제보만 — 공식 출처
      # 대조·수정은 담당 에이전트/사람의 패킷 PR 몫. 네트워크·LLM 없음(결정론), exit 0(비차단).
      - name: Open — checkout for stale scan
        if: steps.mode.outputs.action == 'open'
        uses: actions/checkout@v5
      - name: Open — setup python for stale scan
        if: steps.mode.outputs.action == 'open'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Open — run stale-candidate scan (deterministic, advisory)
        if: steps.mode.outputs.action == 'open'
        id: stale
        continue-on-error: true   # 스캔 실패가 월간 이슈 생성을 깨지 않게(advisory)
        run: |
          python3 scripts/scan-stale-candidates.py --json > /tmp/stale.json || echo '{}' > /tmp/stale.json
          python3 scripts/scan-stale-candidates.py > /tmp/stale.txt || true
          echo "done"
      # 2단계 검증: 1단계 후보를 '문서 내 공식 출처'와 대조(결정론). 네트워크는 source_fetch의
      # SSRF 방어·상한에 의존. LLM은 게이트웨이 secret이 있을 때만(--with-llm), 미설정이면
      # ambiguous 유지(안전 폴백). 실패해도 월간 이슈를 깨지 않는다(continue-on-error, exit 0).
      - name: Open — verify stale candidates against in-doc sources (advisory)
        if: steps.mode.outputs.action == 'open'
        continue-on-error: true
        env:
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          REVIEWER_MODEL: ${{ secrets.REVIEWER_MODEL }}
          REVIEWER_PROVIDER: ${{ secrets.REVIEWER_PROVIDER }}
        run: |
          # 게이트웨이 secret이 모두 있으면 --with-llm, 아니면 결정론+fetch만.
          LLM=""
          if [ -n "$AI_GATEWAY_BASE_URL" ] && [ -n "$AI_GATEWAY_TOKEN" ] && [ -n "$REVIEWER_MODEL" ]; then
            LLM="--with-llm"
          fi
          python3 scripts/verify-stale-candidates.py --candidates /tmp/stale.json --fetch $LLM --json \
            > /tmp/verify.json 2>/dev/null || echo '{}' > /tmp/verify.json
          echo "verify done (llm=${LLM:-off})"
      - name: Open — comment stale scan summary on the issue
        if: steps.mode.outputs.action == 'open'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const year = ${{ steps.mode.outputs.year }};
            const month = ${{ steps.mode.outputs.month }};
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;
            let data;
            try { data = JSON.parse(fs.readFileSync('/tmp/stale.json', 'utf8')); }
            catch { core.warning('stale: JSON 파싱 실패 — 코멘트 생략'); return; }
            const s = data.summary;
            if (!s) { core.info('stale: summary 없음 — 코멘트 생략'); return; }

            // 그 달 이슈 확보
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "routine:monthly-review", per_page: 100,
            });
            const issue = issues.find((i) => i.title === title && !i.pull_request);
            if (!issue) { core.warning(`stale: 그 달 이슈 없음(${title}) — 생략`); return; }

            const highLines = (data.high || []).map(h =>
              `  - \`${h.path}:${h.line}\` — ${h.excerpt}`).join("\n");
            const medLines = (data.medium || []).slice(0, 30).map(m =>
              `  - \`${m.path}:${m.line}\` — ${m.excerpt}`).join("\n");

            // 2단계 검증 결과(있으면). 문서 내 공식 출처와 대조한 contradicted/unverified.
            let verifyBlock = "";
            try {
              const v = JSON.parse(fs.readFileSync('/tmp/verify.json', 'utf8'));
              if (v && v.summary) {
                const vs = v.summary;
                const contra = (v.contradicted || []).map(r =>
                  `  - \`${r.path}:${r.line}\` ← ${r.evidence && r.evidence.url ? r.evidence.url : '?'} — ${r.excerpt}`).join("\n");
                const needHuman = (v.unverified || []).filter(r => r.sub === 'needs-human-source-hunt');
                verifyBlock = [
                  ``,
                  `### 🔎 2단계 검증 (문서 내 공식 출처 대조${vs.fetched ? ', fetch on' : ''})`,
                  `contradicted=${vs.contradicted} · ambiguous=${vs.ambiguous} · supports=${vs.supports} · unverified=${vs.unverified}`,
                  ``,
                  vs.contradicted ? `**contradicted — 공식 출처가 현 서술과 같은 날짜 맥락에서 모순(현행화 유력)**\n${contra}`
                                  : `contradicted 없음.`,
                  needHuman.length ? `\n> unverified 중 ${needHuman.length}건은 문서에 공식 링크가 없어 사람이 출처를 찾아야 합니다.` : ``,
                ].join("\n");
              }
            } catch (e) { /* verify.json 없거나 파싱 실패 → 검증 섹션 생략 */ }

            const body = [
              `<!-- stale-scan:${year}-${String(month).padStart(2,"0")} -->`,
              `## 🧭 기존 문서 stale 후보 스캔 (결정론 · advisory)`,
              ``,
              `whats-new(새 소식)와 별개로, **기존 ko 문서에 이미 박힌 현행성 의심 서술**을 결정론적으로 제보합니다. '매칭 없음 = 최신'이 아니며, 공식 출처 대조·수정은 담당자의 패킷 PR 몫입니다.`,
              ``,
              `**1단계 요약**: HIGH=${s.high} · MEDIUM=${s.medium} · LOW=${s.low} (LOW는 ${s.files_with_low}개 문서)`,
              ``,
              s.high ? `### HIGH — 마커보다 과거인데 '예정' 미래형\n${highLines}` : `### HIGH — 없음 ✅`,
              ``,
              s.medium ? `### MEDIUM — Preview/Beta 상태어 (상위 30건)\n${medLines}` : `### MEDIUM — 없음`,
              verifyBlock,
              ``,
              `_auto-scanned by \`monthly-review.yml\` (open) — 판단·반영은 담당자 몫._`,
            ].join("\n");

            // 같은 달 stale 코멘트가 이미 있으면 skip(멱등)
            const marker = `<!-- stale-scan:${year}-${String(month).padStart(2,"0")} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, per_page: 100,
            });
            if (comments.some((c) => (c.body || "").includes(marker))) {
              core.info(`stale: ${year}-${month} 코멘트 이미 존재 — skip`); return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body,
            });
            core.info(`stale: #${issue.number}에 요약 코멘트 완료.`);

      # Daily: whats-new.cloud MCP(format=source, 벤더 영문 원문)로 전날 신규 릴리스를 조회해,
      # 그 달 이슈에 공식 링크와 함께 코멘트로 누적한다. 봇은 '제보'만 — 사실성 판단·문서 반영은
      # 담당 에이전트/사람의 몫(AGENTS.md 공식 출처·교차검증 원칙). MCP_TOKEN 미설정이면 안전하게
      # 건너뛴다(토큰 없이는 format=source 거부됨). 하루 1회만 — 같은 날 코멘트가 이미 있으면 skip.
      - name: Daily — collect vendor news from whats-new.cloud MCP
        if: steps.mode.outputs.action == 'daily'
        uses: actions/github-script@v9
        env:
          WHATS_NEW_MCP_URL: https://whats-new.cloud/mcp
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        with:
          script: |
            const year = ${{ steps.mode.outputs.year }};
            const month = ${{ steps.mode.outputs.month }};
            const dateKst = "${{ steps.mode.outputs.date_kst }}";
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;

            // 1) 그 달 이슈 확보(없으면 경고 후 종료 — open 단계가 별도로 생성).
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "routine:monthly-review", per_page: 100,
            });
            const issue = issues.find((i) => i.title === title && !i.pull_request);
            if (!issue) {
              core.warning(`daily: 그 달 이슈 없음(${title}) — 수동 open 실행 필요. 소식 수집 건너뜀.`);
              return;
            }

            // 2) 토큰 없으면 안전 skip(format=source는 인증 필수).
            const token = process.env.MCP_TOKEN;
            if (!token) {
              core.warning("daily: MCP_TOKEN 미설정 — whats-new 소식 수집 건너뜀(secrets.MCP_TOKEN 설정 필요).");
              return;
            }

            // 3) 하루 1회 멱등: 같은 날 daily 마커 코멘트가 이미 있으면 skip.
            const marker = `<!-- wnk-daily:${dateKst} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, per_page: 100,
            });
            if (comments.some((c) => (c.body || "").includes(marker))) {
              core.info(`daily: ${dateKst} 코멘트 이미 존재 #${issue.number} — skip.`);
              return;
            }

            // 4) whats-new MCP search_releases(format=source) — csp별 벤더 영문 원문.
            //    whats-new 담당 권고(코드 근거): days=N 롤링 대신 UTC '당일+전일'을 각각
            //    start_date=end_date로 재조회(지연 유입 복구 + 날짜별 안정). limit 50.
            //    OCI는 full CSP로 승격돼 지원. openai(News 피드)·ibm(상태 피드)은 제외.
            //    MCP 서버가 수집·번역·검수를 담당하고, 여기선 '신규 + 공식 링크'만 추출.
            const url = process.env.WHATS_NEW_MCP_URL;
            async function callMcp(args) {
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${token}`,
                  "User-Agent": "cloudpick-docs-monthly-review",
                },
                body: JSON.stringify({
                  jsonrpc: "2.0", id: 1, method: "tools/call",
                  params: { name: "search_releases", arguments: args },
                }),
              });
              if (!res.ok) throw new Error(`MCP HTTP ${res.status}`);
              const data = await res.json();
              if (data.error) throw new Error(`MCP error: ${data.error.message || JSON.stringify(data.error)}`);
              const text = data.result?.content?.[0]?.text ?? "[]";
              // 응답은 JSON 배열 뒤에 "N건 중 M건" 안내문구가 붙을 수 있다 → 배열만 추출.
              const m = text.match(/\[[\s\S]*\]/);
              try { return m ? JSON.parse(m[0]) : []; } catch { return []; }
            }

            // UTC 당일/전일 날짜(YYYY-MM-DD). whats-new는 UTC pub_date 기준.
            const utcNow = new Date();
            const d0 = utcNow.toISOString().slice(0, 10);
            const d1 = new Date(utcNow.getTime() - 86400000).toISOString().slice(0, 10);
            const windowDates = [d1, d0]; // 전일 → 당일 순

            const csps = ["aws", "gcp", "azure", "oci"]; // openai/ibm 제외(권고)
            const PER_CALL = 50;
            let sections = [];
            let errors = [];
            for (const csp of csps) {
              try {
                // 당일+전일 각각 조회 후 article_id 기준 dedupe.
                const seen = new Set();
                const merged = [];
                for (const day of windowDates) {
                  const rows = await callMcp({ csp, format: "source", start_date: day, end_date: day, limit: PER_CALL });
                  for (const r of (Array.isArray(rows) ? rows : [])) {
                    const key = r.article_id ?? `${csp}:${r.url}`; // article_id 우선, 보조 csp+url
                    if (seen.has(key)) continue;
                    seen.add(key);
                    merged.push(r);
                  }
                }
                if (merged.length) {
                  const lines = merged.map((r) => {
                    const t = (r.title || r.original_title || "(untitled)").replace(/\n/g, " ").trim();
                    const d = (r.pub_date || "").slice(0, 10);
                    return `- [${t}](${r.url})${d ? ` _(${d})_` : ""}`;
                  });
                  sections.push(`### ${csp.toUpperCase()} (${merged.length})\n${lines.join("\n")}`);
                }
              } catch (e) {
                errors.push(`${csp}: ${e.message}`);
              }
            }

            // 5) 결과가 없으면 조용히 종료(빈 코멘트로 이슈를 어지럽히지 않는다).
            if (!sections.length) {
              if (errors.length) core.warning(`daily: 수집 실패/빈 결과 — ${errors.join("; ")}`);
              else core.info(`daily: ${d1}~${d0}(UTC) 신규 소식 없음 — 코멘트 생략.`);
              return;
            }

            // 6) 그 달 이슈에 코멘트. 벤더 영문 원문 + 공식 링크. 판단·반영은 사람/에이전트 몫.
            const body = [
              `${marker}`,
              `## 🔔 벤더 새 소식 — ${d1}~${d0} (UTC) · whats-new.cloud`,
              ``,
              `아래는 AWS·GCP·Azure·OCI 공식 What's New에서 **UTC 전일~당일** 신규 항목입니다(출처: whats-new.cloud MCP, 벤더 영문 원문).`,
              `cloudpick-docs 문서에 영향 있는 항목만 교차검증 후 현행화 PR로 반영하고, 반영한 항목은 상단 "이번 달 수집된 새 소식"에 정리하세요. 전부가 문서 반영 대상은 아닙니다.`,
              ``,
              sections.join("\n\n"),
              errors.length ? `\n> ⚠️ 일부 수집 실패: ${errors.join("; ")}` : ``,
              ``,
              `_auto-collected by \`monthly-review.yml\` (daily) — 사실성·관련성 판단은 담당자 몫._`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body,
            });
            core.info(`daily: #${issue.number}에 ${sections.length}개 CSP 소식 코멘트 완료(${d1}~${d0} UTC).`);
