name: Docs Quality

on:
  # required 체크(docs-consistency-lint·mermaid-lint·strikethrough-lint)는 모든 PR에서
  # 실행한다. pull_request.paths 필터를 두면, 필터에 없는 경로만 바꾸는 PR에서 이 체크가
  # 트리거조차 안 돼 required인데 영원히 pending → 머지 불가에 빠진다(실제 발생: 스타일/
  # 컴포넌트·plugins·config·netlify.toml 등). 린터는 PR diff가 아니라 src/content/docs
  # 전체를 순회 검사하므로, 무관한 PR에서 돌아도 전체 문서를 재검증하며 빠르게 통과한다
  # (공허한 승인 아님, fail-closed 유지). 비용은 checkout+python 수십 초 수준.
  # required 체크는 모든 PR에서 실행한다(아래 설명). leveling-guard가 라벨 기반이므로
  # labeled/unlabeled도 구독해야, PR 생성 후 axis-4-leveling 라벨을 붙여도 가드가 돈다
  # (기본 opened/synchronize/reopened에는 labeled가 없음 — Codex P1).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - "scripts/lint-emphasis.py"
      - "scripts/lint-docs-consistency.py"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint Mermaid diagrams
        run: python3 scripts/lint-mermaid.py

  strikethrough-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint unintended strikethrough (~)
        run: python3 scripts/lint-strikethrough.py

  emphasis-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint broken bold boundaries (** before punctuation + CJK)
        run: python3 scripts/lint-emphasis.py

  docs-consistency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint docs consistency (locale parity, review marker, no <details>)
        run: python3 scripts/lint-docs-consistency.py

  # 편집 품질 advisory(비차단) — 가독성·중복·분류. 사람이 육안으로 하던 편집 감사를
  # 결정적으로 재현한다. 모두 warn-only(exit 0)이며, continue-on-error로 이 잡의 결과가
  # 머지를 막지 않는다(브랜치 보호 required 아님). 결과는 Step Summary로 노출한다.
  editorial-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Readability (long/dense paragraphs & sentences)
        run: |
          echo "## 📖 Readability" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-readability.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Duplication (near-duplicate paragraphs across docs)
        run: |
          echo "## 🔁 Duplication" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-duplication.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Taxonomy (sidebar/path consistency & group size)
        run: |
          echo "## 🗂️ Taxonomy" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-taxonomy.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 레벨링 가드(축4) — 'axis-4-leveling' 라벨 PR에서만 사실 불변을 결정론적으로 강제한다.
  # Grok 교정: 비차단 editorial-c-approval 상태가 아니라 '필수' docs-quality 잡으로 둬야
  # 실제로 머지를 차단한다. 라벨이 없으면(일반 PR) 즉시 통과 — 일반 PR의 사실 변경은 정상.
  # 라벨이 있으면: 변경된 ko 문서 각각을 base 버전과 비교해 사실 불변식 위반 시 FAIL.
  leveling-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run leveling guard on changed docs (axis-4-leveling label only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 라벨은 이벤트 payload에서 직접 읽어 API 의존·실패를 피한다(fail-closed).
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'axis-4-leveling') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" != "true" ]; then
            echo "axis-4-leveling 라벨 없음 — 레벨링 가드 건너뜀(일반 PR의 사실 변경은 정상)."
            exit 0
          fi
          echo "axis-4-leveling 라벨 감지 — 변경된 모든 로케일 문서에 사실 불변 가드 적용."
          # 변경 파일은 로컬 git diff로(API 의존 제거). 실패는 그대로 전파(fail-closed, set -e).
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/content/docs/**/*.md' 'src/content/docs/**/*.mdx')
          DOCS=$(echo "$CHANGED" | grep -E '^src/content/docs/(ko|en|ja)/.*\.mdx?$' || true)
          if [ -z "$DOCS" ]; then echo "변경된 문서 없음."; exit 0; fi
          FAIL=0
          for f in $DOCS; do
            if ! git show "$BASE_SHA:$f" > /tmp/base.md 2>/dev/null; then
              echo "신규 파일 $f — base 없음(레벨링 대상 아님, 스킵)"; continue
            fi
            echo "::group::leveling-guard $f"
            if ! python3 scripts/leveling-guard.py --base /tmp/base.md --head "$f"; then
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ 레벨링 PR이 사실을 변경했습니다(어느 로케일이든) — 축1(근거 패킷) 경로로 보내세요."
            exit 1
          fi
          echo "✅ 레벨링 가드 통과(전 로케일 표현 전용)."

  # 링크 현행화 가드 — URL 교체만 했음을 결정론적으로 증명한다.
  # fail-open 차단(governance 투표 반영): 트리거를 변경 가능한 '라벨'이 아니라 '패킷의
  # link-refresh 자격'에서 파생한다. 이 PR이 변경/추가한 패킷 중 policy_action=="link-refresh"가
  # 하나라도 있으면(=classify가 B를 부여하는 바로 그 조건) 가드를 강제한다. 라벨 생략으로
  # 가드를 스킵할 수 없다. link-refresh 패킷이 없으면 즉시 통과(일반 PR·다른 패킷 PR).
  #   1) 해당 패킷들에서 link_refresh.url_map을 읽고 manifest를 대조,
  #   2) 변경된 모든 로케일 문서를 base와 비교해 '재구성 매칭'(URL 외 변경 없음)을 강제한다.
  link-refresh-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run link-refresh guard (derived from packet link-refresh eligibility)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED_ALL=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ALL_PACKETS=$(echo "$CHANGED_ALL" | grep -E '^\.editorial/packets/.*\.json$' || true)
          # 트리거 파생: 변경 패킷 중 policy_action=="link-refresh"인 것만 추린다(라벨 무관).
          PACKETS=""
          for pkt in $ALL_PACKETS; do
            act=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('policy_action',''))" "$pkt" 2>/dev/null || echo "")
            if [ "$act" = "link-refresh" ]; then PACKETS="$PACKETS $pkt"; fi
          done
          PACKETS=$(echo "$PACKETS" | xargs -n1 2>/dev/null || true)
          if [ -z "$PACKETS" ]; then
            echo "link-refresh 패킷 없음 — 링크 현행화 가드 대상 아님(통과)."
            exit 0
          fi
          echo "link-refresh 패킷 감지 — url_map 추출 후 변경 문서에 재구성 매칭 가드 적용."
          # 1) link-refresh 패킷들에서 url_map 병합.
          python3 scripts/link-refresh-manifest.py merge $PACKETS > /tmp/url_map.json
          # 1b) 각 패킷의 manifest_sha256·changed_paths_count를 실제 변경과 대조(완전성·불변성).
          DOCS=$(echo "$CHANGED_ALL" | grep -E '^src/content/docs/(ko|en|ja)/.*\.mdx?$' || true)
          echo "$DOCS" > /tmp/changed_docs.txt
          for pkt in $PACKETS; do
            python3 scripts/link-refresh-manifest.py verify --packet "$pkt" \
              --changed-paths /tmp/changed_docs.txt --base-sha "$BASE_SHA"
          done
          # 2) 변경된 모든 로케일 문서에 재구성 매칭 가드 적용(fail-closed).
          if [ -z "$DOCS" ]; then echo "변경된 문서 없음."; exit 0; fi
          FAIL=0
          for f in $DOCS; do
            if ! git show "$BASE_SHA:$f" > /tmp/base.md 2>/dev/null; then
              echo "❌ 신규 파일 $f — link-refresh는 기존 문서의 URL만 바꾼다(신규/이동 불가)."
              FAIL=1; continue
            fi
            echo "::group::link-refresh-guard $f"
            if ! python3 scripts/link-refresh-guard.py --base /tmp/base.md --head "$f" --mapping /tmp/url_map.json; then
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ link-refresh PR이 URL 외 변경을 포함합니다 — 사실 변경은 축1(근거 패킷) 경로로 보내세요."
            exit 1
          fi
          echo "✅ 링크 현행화 가드 통과(전 로케일 URL 교체 전용)."
