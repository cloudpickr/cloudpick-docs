name: Docs Quality

on:
  # required 체크(docs-consistency-lint·mermaid-lint·strikethrough-lint)는 모든 PR에서
  # 실행한다. pull_request.paths 필터를 두면, 필터에 없는 경로만 바꾸는 PR에서 이 체크가
  # 트리거조차 안 돼 required인데 영원히 pending → 머지 불가에 빠진다(실제 발생: 스타일/
  # 컴포넌트·plugins·config·netlify.toml 등). 린터는 PR diff가 아니라 src/content/docs
  # 전체를 순회 검사하므로, 무관한 PR에서 돌아도 전체 문서를 재검증하며 빠르게 통과한다
  # (공허한 승인 아님, fail-closed 유지). 비용은 checkout+python 수십 초 수준.
  pull_request:
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - "scripts/lint-emphasis.py"
      - "scripts/lint-docs-consistency.py"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint Mermaid diagrams
        run: python3 scripts/lint-mermaid.py

  strikethrough-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint unintended strikethrough (~)
        run: python3 scripts/lint-strikethrough.py

  emphasis-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint broken bold boundaries (** before punctuation + CJK)
        run: python3 scripts/lint-emphasis.py

  docs-consistency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint docs consistency (locale parity, review marker, no <details>)
        run: python3 scripts/lint-docs-consistency.py

  # 편집 품질 advisory(비차단) — 가독성·중복·분류. 사람이 육안으로 하던 편집 감사를
  # 결정적으로 재현한다. 모두 warn-only(exit 0)이며, continue-on-error로 이 잡의 결과가
  # 머지를 막지 않는다(브랜치 보호 required 아님). 결과는 Step Summary로 노출한다.
  editorial-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Readability (long/dense paragraphs & sentences)
        run: |
          echo "## 📖 Readability" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-readability.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Duplication (near-duplicate paragraphs across docs)
        run: |
          echo "## 🔁 Duplication" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-duplication.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Taxonomy (sidebar/path consistency & group size)
        run: |
          echo "## 🗂️ Taxonomy" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lint-taxonomy.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 레벨링 가드(축4) — 'axis-4-leveling' 라벨 PR에서만 사실 불변을 결정론적으로 강제한다.
  # Grok 교정: 비차단 editorial-c-approval 상태가 아니라 '필수' docs-quality 잡으로 둬야
  # 실제로 머지를 차단한다. 라벨이 없으면(일반 PR) 즉시 통과 — 일반 PR의 사실 변경은 정상.
  # 라벨이 있으면: 변경된 ko 문서 각각을 base 버전과 비교해 사실 불변식 위반 시 FAIL.
  leveling-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run leveling guard on changed ko docs (axis-4-leveling label only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          LABELS=$(gh pr view "$PR" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if ! echo "$LABELS" | grep -qx "axis-4-leveling"; then
            echo "axis-4-leveling 라벨 없음 — 레벨링 가드 건너뜀(일반 PR의 사실 변경은 정상)."
            exit 0
          fi
          echo "axis-4-leveling 라벨 감지 — 변경된 ko 문서에 사실 불변 가드 적용."
          CHANGED=$(gh pr view "$PR" --json files --jq '.files[].path' \
                    | grep -E '^src/content/docs/ko/.*\.mdx?$' || true)
          if [ -z "$CHANGED" ]; then echo "변경된 ko 문서 없음."; exit 0; fi
          FAIL=0
          for f in $CHANGED; do
            git show "$BASE_SHA:$f" > /tmp/base.md 2>/dev/null || { echo "신규 파일 $f — 가드 대상 아님(스킵)"; continue; }
            echo "::group::leveling-guard $f"
            if ! python3 scripts/leveling-guard.py --base /tmp/base.md --head "$f"; then
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ 레벨링 PR이 사실을 변경했습니다 — 축1(근거 패킷) 경로로 보내세요."
            exit 1
          fi
          echo "✅ 레벨링 가드 통과(표현 전용)."
