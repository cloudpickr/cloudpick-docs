name: Link Refresh Drafts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create one C-gated draft PR (otherwise report only)
        type: boolean
        default: false
      target:
        description: Optional logical ko document path, e.g. compute/containers.md
        type: string
        default: ''
  schedule:
    - cron: '35 1 * * 2' # Tuesday 10:35 KST; read-only until repository opt-in.

permissions:
  contents: read

concurrency:
  group: link-refresh-drafts
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Always execute trusted master code, even when dispatch is sent to another ref.
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packet validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Prepare report or one draft
        env:
          GH_TOKEN: ${{ secrets.LINK_REFRESH_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'schedule' && vars.LINK_REFRESH_CREATE_PRS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--report "$RUNNER_TEMP/link-refresh-report.json")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ "$PUBLISH" = 'true' ]; then
            gh auth setup-git
            args+=(--publish)
          fi
          python3 scripts/prepare-link-refresh.py "${args[@]}"
      - name: Workflow summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/link-refresh-report.json
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['REPORT'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if path.is_file():
                  data = json.loads(path.read_text())
                  out.write('Link-refresh report (C human approval still required):\n\n')
                  for key in ('checked_urls', 'skipped', 'pr_url', 'previous_pr'):
                      if key in data:
                          out.write(f'- {key}: {data[key]}\n')
                  out.write('\nFull findings and unverified URLs are in the artifact.\n')
              else:
                  out.write('Link-refresh failed before producing a report. Inspect the failed step; no success inferred.\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: link-refresh-report
          path: ${{ runner.temp }}/link-refresh-report.json
          if-no-files-found: warn
          retention-days: 14
