name: Monthly Docs Review

# 월간 문서 현행화 루틴(AGENTS.md "기준 시점: 월 단위 표기, 정기 리뷰로 최신 월 승격").
# 리듬:
#   - 매월 초: 그 달 트래킹 이슈를 자동 생성.
#   - 매일(daily): whats-new.cloud MCP로 전날 벤더 새 소식(영문 원문+공식 링크)을 그 달 이슈에
#     코멘트로 누적한다. 봇은 '제보'만 하고, 쓸만한지 판단·문서 반영은 담당 에이전트/사람의 몫.
#   - 월중: 현행화 PR은 여러 개가 될 수 있고, 각 PR은 이슈를 `Refs #N`으로 참조만 한다(조기 닫힘 방지).
#   - 월말: 사이클이 끝나면 담당자가 이슈를 수동으로 닫는다. (이 워크플로는 이슈를 자동으로 닫지 않는다.)
# 이 워크플로는 "트래킹 이슈"만 관리한다. 실제 현행화(마커 승격·사실 재검증)와 소식의 사실성·공식 링크는
# 담당 에이전트가 책임진다(AGENTS.md 공식 출처·교차검증 원칙).

on:
  schedule:
    - cron: "5 0 1 * *"    # 매월 1일 UTC 00:05 — 그 달 리뷰 이슈 생성
    - cron: "15 0 * * *"   # 매일 UTC 00:15(KST 09:15), 월초 open(UTC 00:05) 이후.
  workflow_dispatch:
    inputs:
      action:
        description: "수동 실행 동작"
        type: choice
        options: [open, daily]
        default: open

permissions:
  contents: write # 월간 원장을 전용 브랜치에 버전 관리
  issues: write

concurrency:
  group: monthly-review
  cancel-in-progress: false

jobs:
  monthly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Determine action (open vs daily)
        id: mode
        uses: actions/github-script@v9
        with:
          script: |
            // schedule: cron으로 분기. "5 0 1 * *"=open, "15 0 * * *"=daily.
            // workflow_dispatch: 입력값 사용(기본 open). close는 없음 — 이슈는 월말에 사람이 닫는다.
            const cron = context.payload.schedule || "";
            let action = "open";
            if (context.eventName === "workflow_dispatch") {
              action = `${{ github.event.inputs.action }}` || "open";
            } else if (cron === "15 0 * * *") {
              action = "daily";
            }
            // KST(UTC+9) 기준 '월'을 제목/마커에 쓴다.
            const now = new Date();
            const kst = new Date(now.getTime() + 9 * 3600 * 1000);
            const year = kst.getUTCFullYear();
            const month = kst.getUTCMonth() + 1; // 1-12
            const day = kst.getUTCDate();
            const dateKst = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            core.setOutput("action", action);
            core.setOutput("year", String(year));
            core.setOutput("month", String(month));
            core.setOutput("day", String(day));
            core.setOutput("date_kst", dateKst);
            core.info(`event=${context.eventName} cron="${cron}" action=${action} date=${dateKst}`);

      - name: Open monthly review issue
        if: steps.mode.outputs.action == 'open' || (steps.mode.outputs.action == 'daily' && steps.mode.outputs.day == '1')
        uses: actions/github-script@v9
        with:
          script: |
            const year = ${{ steps.mode.outputs.year }};
            const month = ${{ steps.mode.outputs.month }};
            function monthName(m){return ["January","February","March","April","May","June","July","August","September","October","November","December"][m-1];}
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;
            const marker = { ko: `${year}년 ${month}월`, en: `${monthName(month)} ${year}`, ja: `${year}年${month}月` };
            const body = [
              `이번 달 문서 현행화 트래킹 이슈입니다.`,
              `(AGENTS.md: 기준 시점은 월 단위로 표기하며 정기 리뷰로 최신 월로 승격.)`,
              ``,
              `## 운영 방식`,
              `이 레포는 ko(SOT) 전체를 **공식 웹 자료 기준**으로 지속 관리하고, 변경을 en·ja에 대칭 반영한다(AGENTS.md "문서 지속 관리 운영 모델" 참고). 관리 범위는 4대 축이다.`,
              `- **① 유지보수**: 기존 문서의 outdated 내용 수정/삭제.`,
              `- **② 새 소식 반영**: 신규 벤더 발표를 기존 범위 안에서 반영(아래 Daily 코멘트가 후보 제보).`,
              `- **③ 범위 확장**: 범위 밖 새 주제/구조 추가 — 5에이전트 과반 의결 대상(봇은 제보만).`,
              `- **④ 재구성/교정**: 구조 결함·서술 오류·중복·낡은 전제 바로잡기.`,
              ``,
              `- **Daily**: 새 소식(벤더 공식 발표 등)이 있으면 이 이슈에 **공식 링크와 함께 코멘트**로 누적한다.`,
              `- **월중 PR**: 현행화 PR은 여러 개가 될 수 있다. 각 PR 설명에 \`Refs #<이 이슈 번호>\`로 **참조만** 한다.`,
              `  - ⚠️ \`Closes/Fixes #N\`은 쓰지 말 것 — PR 하나가 머지되면 이슈가 조기에 닫힌다.`,
              `- **월말**: 사이클이 끝나면 담당자가 이 이슈를 **수동으로 닫는다**(자동 닫힘 없음). 미완 항목은 다음 달 이슈로 이월.`,
              ``,
              `### 후보 처리상태 표기 (중복 제보·누락 방지)`,
              `스캔/검증이 제보한 각 후보 옆에 처리상태를 표기해 다음 달 스캔이 중복 처리하지 않게 한다.`,
              `- ✅ **done** — 현행화 PR 머지 완료(\`Refs #N\` PR 링크).`,
              `- 🟢 **current** — 공식 출처 확인 결과 현행(수정 불필요). 근거 링크 남김.`,
              `- 🟡 **hold** — 공식 출처로 확정 불가(unverified). 다음 달 이월.`,
              `- ⚪ **wontfix** — 의도적 유지(역사적 서술 등). 소스에 \`<!-- stale-ignore: 사유 -->\`로 억제.`,
              ``,
              `## 기준 시점 승격`,
              `- [ ] 전 문서 기준 마커를 \`${marker.ko}\` / \`${marker.en}\` / \`${marker.ja}\`로 승격 (index/introduction 제외)`,
              `- [ ] \`python3 scripts/lint-docs-consistency.py\` 통과 (마커 존재·대칭성)`,
              ``,
              `## 사실 재검증 (벤더 공식문서 교차검증)`,
              `- [ ] "예정"으로 남은 과거 일정(발효/출시) 현행화`,
              `- [ ] Preview → GA 전환 여부 반영`,
              `- [ ] 가격·리전 수·GA/Preview 상태 등 변동 항목 점검`,
              `- [ ] 과거 연도(2024/2025 등) 하드코딩 수치 현행성 재확인`,
              ``,
              `## 링크·구조`,
              `- [ ] 내부 링크(\`npm run build\` starlight-links-validator) 통과`,
              `- [ ] 외부 링크(lychee CI) 깨진 링크 없음`,
              `- [ ] ko/en/ja 대칭성 유지 (파일 경로·내용)`,
              ``,
              `## 로케일 대칭`,
              `- [ ] ko(SOT) 수정분을 en/ja에 100% 반영`,
              ``,
              `## 이번 달 수집된 새 소식 (daily 누적)`,
              `<!-- daily 코멘트로 쌓인 소식 중 문서에 반영한 항목을 여기에 정리 -->`,
              ``,
              `---`,
              `담당: 5개 에이전트(codex/claude/kiro/grok/gemini) 로테이션 또는 합의로 지정.`,
              `구조/분류 변경이 필요하면 과반(3표+) 의결 후 별도 PR.`,
              ``,
              `_auto-generated by \`monthly-review.yml\`_`,
            ].join("\n");

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "all", labels: "routine:monthly-review", per_page: 100,
            });
            const hit = existing.find((i) => i.title === title && !i.pull_request);
            if (hit) {
              if (hit.state !== 'open') throw new Error(`이번 달 이슈 #${hit.number}가 닫혀 있습니다. 중복 생성 대신 기존 이슈를 확인하세요.`);
              core.info(`이미 존재: #${hit.number} — 생성 건너뜀`);
            } else {
              const prev = new Date(Date.UTC(year, month - 2, 1));
              const previousTitle = `📅 월간 문서 현행화 — ${prev.getUTCFullYear()}년 ${prev.getUTCMonth() + 1}월`;
              const previous = existing.find(i => i.title === previousTitle && !i.pull_request);
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: body + (previous ? `\n\n이전 달 기록: #${previous.number}\n` : '\n\n이전 달 이슈를 찾지 못했습니다. 이월 내역을 수동 확인하세요.\n'), labels: ["routine:monthly-review", "documentation"],
              });
              core.info(`생성: #${created.data.number}`);
            }

      # Open(매월 1일) 직후: stale 후보 스캐너(1단계, 결정론)를 ko 전체에 돌려 그 달 이슈에
      # 요약 코멘트를 남긴다. whats-new가 '새로 나온 것'을 제보한다면, 이쪽은 '기존 문서에 이미
      # 박힌 낡았을 수 있는 서술'을 제보한다(push 보완용 pull 스캔). 봇은 제보만 — 공식 출처
      # 대조·수정은 담당 에이전트/사람의 패킷 PR 몫. 네트워크·LLM 없음(결정론), exit 0(비차단).
      - name: Open — checkout for stale scan
        if: steps.mode.outputs.action == 'open'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open — setup python for stale scan
        if: steps.mode.outputs.action == 'open'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Open — inventory and structure signals
        if: steps.mode.outputs.action == 'open'
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/monthly-coverage
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('src/content/docs/ko')
          paths = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.suffix in ('.md', '.mdx'))
          if not paths:
              raise SystemExit('No Korean documents found; coverage cannot be reported as complete')
          Path('/tmp/monthly-coverage/inventory.json').write_text(json.dumps({'documents': paths, 'status': 'scanned-not-reviewed'}, ensure_ascii=False, indent=2))
          PY
          for check in taxonomy duplication readability; do
            if python3 "scripts/lint-${check}.py" > "/tmp/monthly-coverage/${check}.txt" 2>&1; then
              echo "$check: completed; findings are advisory" >> /tmp/monthly-coverage/status.txt
            else
              echo "$check: FAILED; no conclusion" >> /tmp/monthly-coverage/status.txt
            fi
          done
          if python3 scripts/scan-leveling-candidates.py --json > /tmp/monthly-coverage/leveling.json; then
            echo 'leveling: completed; shortlist is advisory' >> /tmp/monthly-coverage/status.txt
          else
            echo 'leveling: FAILED; no conclusion' >> /tmp/monthly-coverage/status.txt
          fi
      - name: Open — upload full inventory and advisory signals
        if: steps.mode.outputs.action == 'open' && always()
        id: coverage_upload
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: monthly-coverage-${{ steps.mode.outputs.year }}-${{ steps.mode.outputs.month }}
          path: /tmp/monthly-coverage/
          if-no-files-found: error
          retention-days: 90
      - name: Open — summarize inventory in monthly issue
        if: steps.mode.outputs.action == 'open' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const year = '${{ steps.mode.outputs.year }}';
            const month = '${{ steps.mode.outputs.month }}';
            const title = `📅 월간 문서 현행화 — ${year}년 ${Number(month)}월`;
            const marker = `<!-- monthly-coverage:${year}-${month.padStart(2, '0')} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'routine:monthly-review', per_page: 100});
            const issue = issues.find(i => i.title === title && !i.pull_request);
            if (!issue) { core.setFailed(`월간 이슈 없음: ${title}`); return; }
            const coverageOutcome = '${{ steps.coverage.outcome }}';
            let detail = '❌ 목록 또는 구조 신호 수집 실패·미실행. 전체 범위는 미확인입니다. Actions 로그를 확인하세요.';
            if (coverageOutcome === 'success') {
              const inventory = JSON.parse(fs.readFileSync('/tmp/monthly-coverage/inventory.json', 'utf8'));
              const status = fs.readFileSync('/tmp/monthly-coverage/status.txt', 'utf8');
              detail = `대상 ${inventory.documents.length}개 문서. 목록과 분류·중복·가독성 신호는 [실행 아티팩트](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})에 있습니다.\n\n\`scanned-not-reviewed\`: 목록 작성은 사실·구조 검토 완료가 아닙니다. 검토하지 않았거나 출처를 확인하지 못한 문서는 미검토·미확인으로 관리합니다.\n\n\`\`\`\n${status}\`\`\``;
              if ('${{ steps.coverage_upload.outcome }}' !== 'success') detail += '\n⚠️ 아티팩트 업로드 실패·미실행: 전체 목록과 신호 보존을 확인할 수 없습니다.';
            }
            const body = `${marker}\n## 전체 한국어 문서 범위와 구조 신호\n\n${detail}\n\n구조 신호는 제안이며 실제 구조 변경은 기존 과반 의결과 문서 승인 절차를 따릅니다.`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100});
            const existing = comments.find(c => (c.body || '').includes(marker) && c.user?.login === 'github-actions[bot]');
            if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body});
      - name: Open — run stale-candidate scan (deterministic, advisory)
        if: steps.mode.outputs.action == 'open'
        id: stale
        continue-on-error: true   # 스캔 실패가 월간 이슈 생성을 깨지 않게(advisory)
        run: |
          python3 scripts/scan-stale-candidates.py --json > /tmp/stale.json
          echo "done"
      # 2단계 검증: 1단계 후보를 '문서 내 공식 출처'와 대조(결정론). 네트워크는 source_fetch의
      # SSRF 방어·상한에 의존. LLM은 게이트웨이 secret이 있을 때만(--with-llm), 미설정이면
      # ambiguous 유지(안전 폴백). 실패해도 월간 이슈를 깨지 않는다(continue-on-error, exit 0).
      - name: Open — verify stale candidates against in-doc sources (advisory)
        if: steps.mode.outputs.action == 'open'
        id: stale_verify
        continue-on-error: true
        env:
          AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          REVIEWER_PROVIDER: ${{ vars.REVIEWER_PROVIDER }}
          REVIEWER_POOL: ${{ vars.REVIEWER_POOL }}
        run: |
          # 게이트웨이가 구성돼 있으면(--with-llm) ambiguous를 LLM으로 판정, 아니면 결정론+fetch만.
          # 기존 워크플로와 동일한 매핑: 설정값은 vars, 토큰만 secret. pool 또는 단일 model 둘 다 허용.
          LLM=""
          if [ -n "$AI_GATEWAY_BASE_URL" ] && [ -n "$AI_GATEWAY_TOKEN" ] \
             && { [ -n "$REVIEWER_MODEL" ] || [ -n "$REVIEWER_POOL" ]; }; then
            LLM="--with-llm"
          fi
          python3 scripts/verify-stale-candidates.py --candidates /tmp/stale.json --fetch $LLM --json \
            > /tmp/verify.json
          echo "verify done (llm=${LLM:-off})"
      - name: Open — comment stale scan summary on the issue
        if: steps.mode.outputs.action == 'open'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const year = ${{ steps.mode.outputs.year }};
            const month = ${{ steps.mode.outputs.month }};
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;
            let data = {};
            try { data = JSON.parse(fs.readFileSync('/tmp/stale.json', 'utf8')); }
            catch (e) { core.warning(`stale: 스캔 결과 읽기 실패: ${e.message}`); }
            const s = data.summary;

            // 그 달 이슈 확보
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "routine:monthly-review", per_page: 100,
            });
            const issue = issues.find((i) => i.title === title && !i.pull_request);
            if (!issue) { core.warning(`stale: 그 달 이슈 없음(${title}) — 생략`); return; }

            if (!s || '${{ steps.stale.outcome }}' !== 'success') {
              const marker = `<!-- stale-scan-failure:${year}-${String(month).padStart(2,"0")} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100});
              const body = `${marker}\n⚠️ 월간 노후 후보 스캔 실패 또는 결과 누락. 기존 문서의 현행성은 미확인입니다. Actions 로그를 확인하고 재실행하세요.`;
              const existing = comments.find(c => (c.body || '').includes(marker) && c.user?.login === 'github-actions[bot]');
              if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body});
              return;
            }

            const highLines = (data.high || []).slice(0, 5).map(h =>
              `  - \`${h.path}:${h.line}\` — ${h.excerpt}`).join("\n");
            const medLines = (data.medium || []).slice(0, 5).map(m =>
              `  - \`${m.path}:${m.line}\` — ${m.excerpt}`).join("\n");

            // 2단계 검증 결과(있으면). 문서 내 공식 출처와 대조한 contradicted/unverified.
            let verifyBlock = "\n⚠️ 2단계 출처 검증 결과 없음 또는 실패 — 후보의 사실 여부는 미확인입니다.";
            try {
              const v = JSON.parse(fs.readFileSync('/tmp/verify.json', 'utf8'));
              if (v && v.summary && '${{ steps.stale_verify.outcome }}' === 'success') {
                const vs = v.summary;
                const contra = (v.contradicted || []).slice(0, 5).map(r =>
                  `  - \`${r.path}:${r.line}\` ← ${r.evidence && r.evidence.url ? r.evidence.url : '?'} — ${r.excerpt}`).join("\n");
                const needHuman = (v.unverified || []).filter(r => r.sub === 'needs-human-source-hunt');
                verifyBlock = [
                  ``,
                  `### 🔎 2단계 검증 (문서 내 공식 출처 대조${vs.fetched ? ', fetch on' : ''})`,
                  `contradicted=${vs.contradicted} · ambiguous=${vs.ambiguous} · supports=${vs.supports} · unverified=${vs.unverified}`,
                  ``,
                  vs.contradicted ? `**contradicted — 공식 출처가 현 서술과 같은 날짜 맥락에서 모순(현행화 유력)**\n${contra}`
                                  : `contradicted 없음.`,
                  needHuman.length ? `\n> unverified 중 ${needHuman.length}건은 문서에 공식 링크가 없어 사람이 출처를 찾아야 합니다.` : ``,
                ].join("\n");
              }
            } catch (e) { core.warning(`stale: 검증 결과 읽기 실패: ${e.message}`); }

            const body = [
              `<!-- stale-scan:${year}-${String(month).padStart(2,"0")} -->`,
              `## 기존 문서 검토 후보`,
              ``,
              `기존 문서에서 현행성 확인이 필요한 후보입니다. 자동 탐지는 최신성 검증을 대신하지 않습니다.`,
              ``,
              `**1단계 요약**: HIGH=${s.high} · MEDIUM=${s.medium} · LOW=${s.low} (LOW는 ${s.files_with_low}개 문서)`,
              ``,
              s.high ? `### 지난 시점의 예정 표현 (최대 5건)\n${highLines}` : `지난 시점의 예정 표현 후보 없음.`,
              ``,
              s.medium ? `### Preview/Beta 상태 확인 (최대 5건)\n${medLines}` : `Preview/Beta 상태 확인 후보 없음.`,
              verifyBlock,
              ``,
              `전체 후보는 이슈 본문의 월간 원장에서 확인하세요.`,
            ].join("\n");

            // 같은 달 stale 코멘트가 이미 있으면 skip(멱등)
            const marker = `<!-- stale-scan:${year}-${String(month).padStart(2,"0")} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, per_page: 100,
            });
            if (comments.some((c) => (c.body || "").includes(marker))) {
              core.info(`stale: ${year}-${month} 코멘트 이미 존재 — skip`); return;
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body});
            core.info(`stale: #${issue.number}에 요약 코멘트 완료.`);

      - name: Open — maintain monthly document and candidate ledger
        if: steps.mode.outputs.action == 'open' && !cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const ledger = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_ledger.cjs`);
            const store = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_store.cjs`);
            const year = Number('${{ steps.mode.outputs.year }}');
            const month = Number('${{ steps.mode.outputs.month }}');
            const key = `${year}-${String(month).padStart(2, '0')}`;
            const prevDate = new Date(Date.UTC(year, month - 2, 1));
            const previousKey = `${prevDate.getUTCFullYear()}-${String(prevDate.getUTCMonth()+1).padStart(2,'0')}`;
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;
            const previousTitle = `📅 월간 문서 현행화 — ${prevDate.getUTCFullYear()}년 ${prevDate.getUTCMonth()+1}월`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner: context.repo.owner, repo: context.repo.repo, state: 'all', labels: 'routine:monthly-review', per_page: 100});
            const issue = issues.find(i => i.title === title && !i.pull_request && i.state === 'open');
            if (!issue) throw new Error(`open monthly issue missing: ${title}`);
            const previous = issues.find(i => i.title === previousTitle && !i.pull_request);
            if (!fs.existsSync('/tmp/monthly-coverage/inventory.json') || '${{ steps.coverage.outcome }}' !== 'success') throw new Error('inventory unavailable; ledger cannot claim complete scope');
            const inventory = JSON.parse(fs.readFileSync('/tmp/monthly-coverage/inventory.json', 'utf8'));
            const paths = inventory.documents.map(p => `src/content/docs/ko/${p}`);
            const currentLedger = await store.load(github, context, issue);
            const previousLedger = previous ? await store.load(github, context, previous) : null;
            if (previousLedger && previousLedger.month !== previousKey) throw new Error('previous ledger month mismatch');
            let candidates = [];
            if ('${{ steps.stale.outcome }}' === 'success') {
              const scan = JSON.parse(fs.readFileSync('/tmp/stale.json', 'utf8'));
              candidates = [...(scan.high || []), ...(scan.medium || [])].map(c => ({path: c.path, axis: 1, reason: `${c.rule}: ${c.excerpt}`, line: c.line, origin: 'stale'}));
            }
            const status = fs.readFileSync('/tmp/monthly-coverage/status.txt', 'utf8');
            for (const kind of ['taxonomy', 'duplication', 'readability']) {
              if (!status.includes(`${kind}: completed;`)) continue;
              const lines = fs.readFileSync(`/tmp/monthly-coverage/${kind}.txt`, 'utf8').split('\n');
              for (const line of lines.filter(s => s.includes(`[${kind}]`))) {
                const match = line.match(/\[readability\]\s+([^ ]+\.mdx?)\s+—/);
                candidates.push({path: match ? `src/content/docs/ko/${match[1]}` : null, axis: match ? 4 : 3, reason: line.trim(), origin: kind});
              }
            }
            if (status.includes('leveling: completed;')) {
              const leveling = JSON.parse(fs.readFileSync('/tmp/monthly-coverage/leveling.json', 'utf8'));
              for (const row of (leveling.shortlist || [])) candidates.push({path: row.path, axis: 4, reason: 'leveling shortlist: 가독성·미확정 서술 후보', origin: 'leveling'});
            }
            const coverage = {inventory:'success', stale:'${{ steps.stale.outcome }}', source_verification:'${{ steps.stale_verify.outcome }}'};
            for (const kind of ['taxonomy','duplication','readability','leveling']) coverage[kind] = status.includes(`${kind}: completed;`) ? 'success' : 'failure';
            const rescanned = Object.keys(coverage).filter(k => coverage[k] === 'success');
            const next = ledger.build(key, paths, previousLedger, currentLedger, candidates, {coverage, rescanned});
            const counts = Object.fromEntries(['unreviewed','scanned','verified','unverified'].map(s => [s, next.documents.filter(d => d.status === s).length]));
            core.info(`ledger ${key}: ${JSON.stringify(counts)}; items=${next.items.length}; previous=${previousLedger ? previousKey : 'unavailable'}`);
            if (!previousLedger) {
              core.warning('전월 원장 없음: 이전 미완 항목을 자동으로 확인할 수 없습니다. 이전 이슈를 수동 확인하세요.');
            }
            // Refresh the visible summary even when a maintainer only edited a
            // current snapshot comment since the previous run.
            await store.save(github, context, issue, next, {expected: currentLedger});

      - name: Daily — checkout trusted scripts
        if: steps.mode.outputs.action == 'daily' && !cancelled()
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Daily — setup python
        if: steps.mode.outputs.action == 'daily' && !cancelled()
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Daily: whats-new.cloud MCP(format=source, 벤더 영문 원문)로 전날 신규 릴리스를 조회해,
      # 그 달 이슈에 공식 링크와 함께 코멘트로 누적한다. 봇은 '제보'만 — 사실성 판단·문서 반영은
      # 담당 에이전트/사람의 몫(AGENTS.md 공식 출처·교차검증 원칙). MCP_TOKEN 미설정이면 안전하게
      # 건너뛴다(토큰 없이는 format=source 거부됨). 하루 1회만 — 같은 날 코멘트가 이미 있으면 skip.
      - name: Daily — collect vendor news from whats-new.cloud MCP
        if: steps.mode.outputs.action == 'daily'
        id: daily
        uses: actions/github-script@v9
        env:
          WHATS_NEW_MCP_URL: https://whats-new.cloud/mcp
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
        with:
          script: |
            const year = ${{ steps.mode.outputs.year }};
            const month = ${{ steps.mode.outputs.month }};
            const dateKst = "${{ steps.mode.outputs.date_kst }}";
            const title = `📅 월간 문서 현행화 — ${year}년 ${month}월`;

            // 1) 그 달 이슈 확보(없으면 경고 후 종료 — open 단계가 별도로 생성).
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "routine:monthly-review", per_page: 100,
            });
            const issue = issues.find((i) => i.title === title && !i.pull_request);
            if (!issue) {
              core.setFailed(`daily: 그 달 이슈 없음(${title}) — 수동 open 실행 필요. 소식 수집 건너뜀.`);
              return;
            }

            const fs = require('fs');
            const store = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_store.cjs`);
            const news = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_news.cjs`);
            const current = await store.load(github, context, issue);
            if (!current) throw new Error('월간 원장이 없습니다. 월간 open 실행을 먼저 완료하세요.');
            const utcNow = new Date();
            const d0 = utcNow.toISOString().slice(0, 10);
            const d1 = new Date(utcNow.getTime() - 86400000).toISOString().slice(0, 10);
            const progress = news.initialize(d0, current.news_progress);
            const planned = news.plan(progress, d0);
            const attempts = [];

            // 토큰이 없으면 계획된 범위를 실패로 기록해 다음 실행에서 재시도한다.
            const token = process.env.MCP_TOKEN;
            if (!token) {
              core.warning("daily: MCP_TOKEN 미설정 — whats-new 소식 수집 건너뜀(secrets.MCP_TOKEN 설정 필요).");
              const failureMarker = `<!-- wnk-daily-failure:${dateKst} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100});
              if (!comments.some(c => (c.body || '').includes(failureMarker))) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `${failureMarker}\n⚠️ ${dateKst} 새 소식 수집 실패: MCP_TOKEN 미설정. 해당 기간은 미확인입니다.`});
              for (const vendor of news.VENDORS) for (const date of planned[vendor]) attempts.push({vendor, date, state:'failed'});
              fs.writeFileSync('/tmp/news-attempts.json', JSON.stringify({progress, attempts, today:d0}));
              fs.writeFileSync('/tmp/news-items.json', '[]');
              core.setOutput('issue_number', String(issue.number));
              core.setOutput('date_range', `catch-up-${dateKst}`);
              core.setFailed('daily: source token unavailable');
              return;
            }

            // 3) 하루 1회 멱등: 같은 날 daily 마커 코멘트가 이미 있으면 skip.
            const marker = `<!-- wnk-daily:${dateKst} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, per_page: 100,
            });
            const existingDaily = comments.find(c => (c.body || '').includes(marker) && c.user?.login === 'github-actions[bot]');

            // 4) whats-new MCP search_releases(format=source) — csp별 벤더 영문 원문.
            //    whats-new 담당 권고(코드 근거): days=N 롤링 대신 UTC '당일+전일'을 각각
            //    start_date=end_date로 재조회(지연 유입 복구 + 날짜별 안정). limit 50.
            //    OCI는 full CSP로 승격돼 지원. openai(News 피드)·ibm(상태 피드)은 제외.
            //    MCP 서버가 수집·번역·검수를 담당하고, 여기선 '신규 + 공식 링크'만 추출.
            const url = process.env.WHATS_NEW_MCP_URL;
            async function callMcp(args) {
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${token}`,
                  "User-Agent": "cloudpick-docs-monthly-review",
                },
                body: JSON.stringify({
                  jsonrpc: "2.0", id: 1, method: "tools/call",
                  params: { name: "search_releases", arguments: args },
                }),
                signal: AbortSignal.timeout(30000),
              });
              if (!res.ok) throw new Error(`MCP HTTP ${res.status}`);
              const data = await res.json();
              return news.parseResponse(data, args.limit);
            }

            const csps = news.VENDORS; // 현재 피드가 지원하는 네 CSP. 그 외 출처는 자동 확인하지 않음.
            const PER_CALL = 50;
            let sections = [];
            let errors = [];
            const allItems = [];  // 축2 매핑용: 수집된 모든 항목(title/url/csp) 누적
            for (const csp of csps) {
              const seen = new Set();
              const merged = [];
              for (const day of planned[csp]) {
                let rows, truncated = false;
                try {
                  rows = await callMcp({ csp, format: "source", start_date: day, end_date: day, limit: PER_CALL });
                } catch (e) {
                  if (Array.isArray(e.partialRows)) {
                    rows = e.partialRows;
                    truncated = true;
                    errors.push(`${csp}/${day}: ${e.message}`);
                  } else {
                    attempts.push({vendor:csp, date:day, state:'failed'});
                    errors.push(`${csp}/${day}: ${e.message}`);
                    continue;
                  }
                }
                try {
                  for (const r of (Array.isArray(rows) ? rows : [])) {
                    const key = r.article_id ?? `${csp}:${r.url || r.title || r.original_title}:${day}`;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    merged.push(r);
                    allItems.push({
                      title: (r.title || r.original_title || "").replace(/\n/g, " ").trim(),
                      url: r.url, csp, date: day,
                    });
                  }
                  attempts.push({vendor:csp, date:day, state:news.stateFor(day, d0, truncated)});
                } catch (e) {
                  attempts.push({vendor:csp, date:day, state:'failed'});
                  errors.push(`${csp}/${day}: ${e.message}`);
                }
              }
              if (merged.length) {
                const lines = merged.slice(0, 3).map((r) => {
                  const t = (r.title || r.original_title || "(untitled)").replace(/\n/g, " ").trim();
                  const d = (r.pub_date || "").slice(0, 10);
                  return `- [${t}](${r.url})${d ? ` _(${d})_` : ""}`;
                });
                sections.push(`### ${csp.toUpperCase()} ${merged.length}건\n${lines.join("\n")}${merged.length > 3 ? `\n- 외 ${merged.length - 3}건은 월간 원장 참조` : ''}`);
              }
            }

            // Set outputs before posting so a comment error cannot silently skip the ledger.
            fs.writeFileSync('/tmp/news-attempts.json', JSON.stringify({progress, attempts, today:d0}));
            fs.writeFileSync('/tmp/news-items.json', JSON.stringify(allItems));
            core.setOutput('issue_number', String(issue.number));
            core.setOutput('date_range', `catch-up-${dateKst}`);

            // 5) 결과가 없으면 조용히 종료(빈 코멘트로 이슈를 어지럽히지 않는다).
            if (!sections.length) {
              if (errors.length) {
                core.warning(`daily: 수집 실패/빈 결과 — ${errors.join("; ")}`);
                const failureMarker = `<!-- wnk-daily-failure:${dateKst} -->`;
                if (!comments.some(c => (c.body || '').includes(failureMarker))) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `${failureMarker}\n⚠️ ${dateKst} 새 소식 수집 일부 또는 전체 실패. 해당 기간은 미확인입니다: ${errors.join('; ')}`});
                core.setFailed('daily: vendor source collection failed');
              }
              else {
                if (!existingDaily) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `${marker}\n✅ ${d1}–${d0} UTC 새 소식 조회 완료: 결과 없음. 수집 범위 밖 소식 및 문서 최신성은 별도 검토가 필요합니다.`});
              }
              return;
            }

            // 6) 그 달 이슈에 코멘트. 벤더 영문 원문 + 공식 링크. 판단·반영은 사람/에이전트 몫.
            const body = [
              errors.length ? `<!-- wnk-daily-partial:${dateKst} -->` : `${marker}`,
              `## 🔔 벤더 새 소식 — ${d1}–${d0} 및 미수집 날짜 복구 (UTC) · whats-new.cloud`,
              ``,
              `수집 ${allItems.length}건 · ${errors.length ? `수집 실패 ${errors.length}건` : '수집 실패 없음'}. 각 벤더의 일부만 표시합니다.`,
              `관련 문서와 전체 후보는 월간 원장을 확인하세요. 문서 반영 전 공식 출처 확인이 필요합니다.`,
              ``,
              sections.join("\n\n"),
              errors.length ? `\n> ⚠️ 일부 수집 실패: ${errors.join("; ")}` : ``,
              ``,
            ].join("\n");

            const partialMarker = `<!-- wnk-daily-partial:${dateKst} -->`;
            const partial = errors.length && comments.find(c => (c.body || '').includes(partialMarker) && c.user?.login === 'github-actions[bot]');
            if (!errors.length && existingDaily) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existingDaily.id, body});
            else if (partial) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: partial.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body});
            core.info(`daily: #${issue.number}에 ${sections.length}개 CSP 소식 코멘트 완료(${d1}~${d0} UTC).`);

            if (errors.length) core.setFailed('daily: vendor source collection partially failed; successful items remain available');

      # 축2 매핑(제보 전용): daily가 수집한 새 소식을 관련 ko 문서 후보에 결정론 매핑해
      # 같은 이슈에 코멘트로 제보한다. 반영은 사람/에이전트의 근거 패킷 PR(AGENTS.md 축2).
      # daily가 이슈 번호를 output으로 넘겼을 때만(=수집 성공) 실행. 실패해도 이슈를 깨지 않는다.
      - name: Daily — map news to candidate docs and comment
        if: steps.mode.outputs.action == 'daily' && steps.daily.outputs.issue_number != '' && !cancelled()
        id: news_map
        continue-on-error: true
        env:
          ISSUE: ${{ steps.daily.outputs.issue_number }}
          RANGE: ${{ steps.daily.outputs.date_range }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 수집 항목이 없으면 조용히 종료.
          if [ ! -s /tmp/news-items.json ]; then echo "수집 결과 없음"; exit 1; fi
          python3 scripts/map-news-to-docs.py --news /tmp/news-items.json --json > /tmp/news-map.json
          python3 scripts/post-news-map-comment.py /tmp/news-map.json "$ISSUE" "$RANGE"

      - name: Daily — add news signals to monthly ledger
        if: steps.mode.outputs.action == 'daily' && steps.daily.outputs.issue_number != '' && steps.news_map.outcome != 'skipped' && !cancelled()
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.daily.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/news-map.json') || !fs.existsSync('/tmp/news-attempts.json')) throw new Error('news mapping or attempt data missing');
            const ledger = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_ledger.cjs`);
            const store = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_store.cjs`);
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const {data: issue} = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
            const current = await store.load(github, context, issue);
            if (!current) throw new Error('monthly ledger unavailable; news cannot be silently marked tracked');
            const mapped = JSON.parse(fs.readFileSync('/tmp/news-map.json', 'utf8'));
            const attempts = JSON.parse(fs.readFileSync('/tmp/news-attempts.json', 'utf8'));
            const news = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_news.cjs`);
            if (JSON.stringify(news.initialize(attempts.today, current.news_progress)) !== JSON.stringify(attempts.progress)) throw new Error('news progress changed during collection; retry without overwriting updates');
            const candidates = [];
            for (const row of (mapped.mapped || [])) for (const doc of (row.candidates || [])) {
              candidates.push({path: doc.path, axis: 2, reason: `${row.news} (${row.url || '출처 미확인'})`, source_url: row.url || null, source_status: 'unverified'});
            }
            for (const row of (mapped.unmapped || [])) candidates.push({path: null, axis: 3, reason: `${row.news} (${row.url || '출처 미확인'})`, source_url: row.url || null, source_status: 'unverified'});
            // Commit collection progress only together with successfully mapped candidates.
            const progress = news.apply(attempts.progress, attempts.attempts);
            const next = ledger.build(current.month, current.documents.filter(d => !d.missing_from_inventory).map(d => d.path), null, current, candidates, {news_progress:progress});
            if (JSON.stringify(current) !== JSON.stringify(next)) await store.save(github, context, issue, next, {expected: current});
      - name: Daily — report mapping failure
        if: steps.mode.outputs.action == 'daily' && steps.news_map.outcome == 'failure' && !cancelled()
        run: exit 1

      - name: Daily — load source observation state
        if: steps.mode.outputs.action == 'daily' && steps.daily.outputs.issue_number != '' && !cancelled()
        id: source_load
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.daily.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const store = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_store.cjs`);
            const {data: issue} = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER)});
            const current = await store.load(github, context, issue);
            if (!current) throw new Error('monthly ledger unavailable; source scan cannot run');
            fs.writeFileSync('/tmp/source-observation-before.json', JSON.stringify(current.source_progress || null));
            fs.writeFileSync('/tmp/source-refs-before.json', JSON.stringify(current.source_progress?.refs || {}));
      - name: Daily — inspect a bounded batch of cited sources
        if: steps.mode.outputs.action == 'daily' && steps.source_load.outcome == 'success' && !cancelled()
        id: source_scan
        run: python3 scripts/scan-source-changes.py --previous /tmp/source-refs-before.json --output /tmp/source-observation.json
      - name: Daily — record source change signals
        if: steps.mode.outputs.action == 'daily' && steps.source_scan.outcome == 'success' && !cancelled()
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.daily.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const store = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_store.cjs`);
            const ledger = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monthly_ledger.cjs`);
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const {data: issue} = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
            const current = await store.load(github, context, issue);
            if (!current) throw new Error('monthly ledger unavailable; source results cannot be stored');
            const before = JSON.parse(fs.readFileSync('/tmp/source-observation-before.json', 'utf8'));
            if (JSON.stringify(current.source_progress || null) !== JSON.stringify(before)) throw new Error('source state changed during scan; no overwrite performed');
            const result = JSON.parse(fs.readFileSync('/tmp/source-observation.json', 'utf8'));
            if (!result.refs || !Array.isArray(result.candidates) || result.checked > 75) throw new Error('invalid source observation');
            const progress = {version: 1, refs: result.refs};
            const paths = require('child_process').execFileSync('git', ['ls-files', '-z', '--', 'src/content/docs/ko/'], {encoding: 'utf8'}).split('\0').filter(p => /\.mdx?$/.test(p));
            if (!paths.length) throw new Error('Korean inventory unavailable');
            const next = ledger.build(current.month, paths, null, current, result.candidates, {source_progress: progress});
            await store.save(github, context, issue, next, {expected: current});
            core.info(`출처 ${result.checked}/${result.total}개 조회, ${result.failed}개 미확인, 변경 신호 ${result.candidates.length}건. 사실 판정 아님.`);
