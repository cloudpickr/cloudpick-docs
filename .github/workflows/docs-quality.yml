name: Docs Quality

on:
  pull_request:
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - "scripts/lint-mermaid.py"
      - "scripts/lint-strikethrough.py"
      - ".github/workflows/docs-quality.yml"

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint Mermaid diagrams
        run: python3 scripts/lint-mermaid.py

  strikethrough-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint unintended strikethrough (~)
        run: python3 scripts/lint-strikethrough.py
