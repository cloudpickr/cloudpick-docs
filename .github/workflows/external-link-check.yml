name: External Link Check

on:
  # 매 커밋(push/PR)마다 — 문서 콘텐츠가 바뀔 때 깨진 링크를 즉시 차단
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - ".github/workflows/external-link-check.yml"
      - ".lycheeignore"
  pull_request:
    paths:
      - "src/content/docs/**"
      - ".github/workflows/external-link-check.yml"
      - ".lycheeignore"
  # 주기 점검 — 콘텐츠 변경이 없어도 외부 링크가 죽는 link-rot을 잡음
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 UTC 00:00
  workflow_dispatch: # 수동 실행 가능

# 동일 ref의 이전 실행은 취소(빠른 피드백)
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # http(s) URL만 검사 — 내부 상대 링크(../..)는 Astro가 라우팅하며
          # lychee가 파일 경로로 오해해 오탐을 내므로 스킴을 http/https로 한정한다.
          args: >-
            --verbose
            --no-progress
            --scheme https
            --scheme http
            --accept 200,204,301,302,307,308,403,429
            --timeout 30
            --max-retries 3
            "src/content/docs/**/*.md"
            "src/content/docs/**/*.mdx"
          # push/PR에서는 깨진 링크 발견 시 워크플로를 실패시켜 커밋 단계에서 차단.
          # 스케줄 실행에서는 실패 대신 이슈만 생성(link-rot 추적).
          fail: ${{ github.event_name != 'schedule' }}
          output: ./lychee/out.md

      # 스케줄 실행에서 깨진 링크가 있으면 추적 이슈 생성
      - name: Create issue if broken links found (scheduled)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 외부 링크 점검: 깨진 링크 발견"
          content-filepath: ./lychee/out.md
          labels: documentation,link-rot
          assignees: froguin

      # push/PR 실패 시 로그에 결과를 남겨 어떤 링크가 깨졌는지 바로 확인
      - name: Show broken links on failure
        if: failure()
        run: cat ./lychee/out.md || true
