name: External Link Check

on:
  # 매 커밋(push/PR)마다 — 문서 콘텐츠가 바뀔 때 깨진 링크를 즉시 차단
  push:
    branches: [master, main]
    paths:
      - "src/content/docs/**"
      - ".github/workflows/external-link-check.yml"
      - "scripts/check-korean-links.mjs"
      - "scripts/check-korean-links.test.mjs"
      - "lychee.toml"
  pull_request:
    paths:
      - "src/content/docs/**"
      - ".github/workflows/external-link-check.yml"
      - "scripts/check-korean-links.mjs"
      - "scripts/check-korean-links.test.mjs"
      - "lychee.toml"
  # 주기 점검 — 콘텐츠 변경이 없어도 외부 링크가 죽는 link-rot을 잡음
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 UTC 00:00
  workflow_dispatch: # 수동 실행 가능

# 동일 ref의 이전 실행은 취소(빠른 피드백)
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Test Korean link checker adapter
        run: node --test scripts/check-korean-links.test.mjs

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 오탐 완화 설정은 lychee.toml에 통합(User-Agent, host-concurrency,
          # accept 코드, 봇 차단 도메인 제외 등). 로컬 검사와 동일 설정을 공유.
          args: >-
            --verbose
            --no-progress
            --config lychee.toml
            --root-dir "${{ github.workspace }}/src/content/docs"
            "src/content/docs/**/*.md"
            "src/content/docs/**/*.mdx"
          # push/PR에서는 깨진 링크 발견 시 워크플로를 실패시켜 커밋 단계에서 차단.
          # 스케줄 실행에서는 실패 대신 이슈만 생성(link-rot 추적).
          fail: ${{ github.event_name != 'schedule' }}
          output: ./lychee/out.md

      # GitHub-hosted runners are sometimes blocked by Korean public sites.
      # A tiny NCP Korea function checks only the allowlisted Korean links and
      # blocks only confirmed 404/410 responses. Missing secrets or an NCP
      # outage remain warnings; the normal lychee gate above still applies.
      - name: Check Korean links from NCP
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          NCP_LINK_CHECKER_URL: ${{ secrets.NCP_LINK_CHECKER_URL }}
          NCP_LINK_CHECKER_API_KEY: ${{ secrets.NCP_LINK_CHECKER_API_KEY }}
        run: node scripts/check-korean-links.mjs

      # 스케줄 실행에서 깨진 링크가 있으면 추적 이슈 생성
      - name: Create issue if broken links found (scheduled)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 외부 링크 점검: 깨진 링크 발견"
          content-filepath: ./lychee/out.md
          labels: documentation,link-rot
          assignees: froguin

      # push/PR 실패 시 로그에 결과를 남겨 어떤 링크가 깨졌는지 바로 확인
      - name: Show broken links on failure
        if: failure()
        run: cat ./lychee/out.md || true
