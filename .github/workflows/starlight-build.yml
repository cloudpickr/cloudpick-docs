name: Build

on:
  # build(required)는 모든 PR에서 실행한다. pull_request.paths 필터를 두면 필터에 없는
  # 경로만 바꾸는 PR에서 트리거조차 안 돼 required인데 영원히 pending(머지 불가)에 빠진다.
  # build는 사이트 전체를 빌드하고 내부 링크를 검증하므로 무관한 PR에서 돌아도 의미가 있다.
  pull_request:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/starlight-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
