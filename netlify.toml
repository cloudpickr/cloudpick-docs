[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ─── Build Plugin: llms-full.txt를 Blob에 업로드하고 dist에서 삭제 ───
[[plugins]]
  package = "./plugins/upload-llms-blob"

# ─── 모든 리디렉트를 netlify.toml에 통합 ───
# _redirects 파일은 netlify.toml redirects를 오버라이드하므로 사용하지 않음.
# netlify.toml에서는 :placeholder.md 패턴이 정상 동작함.

# ─── LLMs.txt 접근 제어 (llms.txt 공개, full/small은 MCP 전용) ───
[[redirects]]
  from = "/llms-full.txt"
  to = "/404/"
  status = 404
  force = true

[[redirects]]
  from = "/llms-small.txt"
  to = "/404/"
  status = 404
  force = true

# 언어별 llms 원천(llms-full-{ko,en,ja}.txt)·라우팅 인덱스는 MCP 전용 — 공개 차단
[[redirects]]
  from = "/llms/*"
  to = "/404/"
  status = 404
  force = true

# ─── Netlify Function 프록시 ───
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp"
  status = 200

